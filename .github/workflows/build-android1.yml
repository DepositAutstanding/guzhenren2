name: Build Native Lib
on:
  workflow_dispatch:
jobs:
  build-so:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 解开源码压缩包
        run: |
          for f in *.tar.gz; do
            [ -f "$f" ] || continue
            echo "解开: $f"
            tar -xzf "$f"
          done
          ls -a
          ls android/app/src/main/cpp/CMakeLists.txt || echo "!! 缺 CMakeLists.txt"

      - name: 安装 NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: 配置 CMake
        run: |
          cmake -S android/app/src/main/cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release

      - name: 编译
        run: cmake --build build -j4

      - name: 收集
        run: |
          mkdir -p out
          find build -name 'libguzhenren.so' -exec cp -v {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: guzhenren-so
          path: out/libguzhenren.so
          if-no-files-found: error
