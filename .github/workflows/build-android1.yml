name: Build Native Lib

on:
  workflow_dispatch:

jobs:
  build-so:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解开源码压缩包
        run: |
          for f in *.tar.gz; do
            [ -f "$f" ] || continue
            echo "解开: $f"
            tar -xzf "$f"
          done
          echo "--- 顶层结构 ---"
          ls -a
          echo "--- 关键文件自查 ---"
          for p in android/app/src/main/cpp/CMakeLists.txt \
                   android/app/src/main/cpp/android_main.cpp \
                   src/ui/AndroidViewport.cpp \
                   include/gr/ui/AndroidViewport.hpp \
                   third_party/imgui/imgui.cpp ; do
            if [ -f "$p" ]; then echo "  OK   $p"; else echo "  !!缺失 $p"; fi
          done
          echo "--- 三个标记目录是否存在于工程根 ---"
          for d in src include third_party; do
            if [ -d "$d" ]; then echo "  OK   $d/"; else echo "  !!缺 $d/"; fi
          done
          echo "--- 若 src/ 不在根，实际在哪 ---"
          find . -maxdepth 4 -type d -name src 2>/dev/null | head -10
          echo "--- src/ 下的子目录 ---"
          ls src/ 2>/dev/null || echo "  !! src/ 不存在"
          echo "--- 各子目录 .cpp 数量 ---"
          for d in ai battle core cultivator gu net sim ui world; do
            n=$(ls src/$d/*.cpp 2>/dev/null | wc -l)
            echo "  src/$d: $n"
          done
          echo "--- 合计 ---"
          find src -name '*.cpp' 2>/dev/null | wc -l

      - name: 下载 NDK r27c
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "=== 开始下载 NDK ==="
          curl -sSL --retry 3 --retry-delay 5 \
            -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          echo "下载完成，大小: $(stat -c%s ndk.zip) 字节"
          unzip -q ndk.zip
          NDK="$GITHUB_WORKSPACE/android-ndk-r27c"
          echo "NDK_PATH=$NDK" >> $GITHUB_ENV
          echo "=== NDK 目录 ==="
          ls "$NDK"

      - name: 校验 NDK 关键文件
        run: |
          NDK="$NDK_PATH"
          echo "NDK_PATH=$NDK"
          echo "=== toolchain ==="
          ls -la "$NDK/build/cmake/android.toolchain.cmake" || echo "!! 缺 toolchain"
          echo "=== native_app_glue ==="
          ls -la "$NDK/sources/android/native_app_glue/" || echo "!! 缺 native_app_glue"
          echo "=== clang ==="
          ls "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -5
          G=$(find "$NDK" -name 'android_native_app_glue.c' -print -quit 2>/dev/null)
          if [ -n "$G" ]; then
            echo "GLUE_PATH=$(dirname "$G")" >> $GITHUB_ENV
            echo "定位到 glue: $G"
          else
            echo "::warning::NDK 内未找到 android_native_app_glue.c"
          fi

      - name: 配置 CMake
        run: |
          cd "$GITHUB_WORKSPACE"
          cmake -S android/app/src/main/cpp -B build \
            -DGZR_ROOT="$GITHUB_WORKSPACE" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_NDK="$NDK_PATH" \
            -DGLUE_PATH="$GLUE_PATH" \
            --no-warn-unused-cli 2>&1 | tee cmake-config.log
          echo "=== 配置退出码: ${PIPESTATUS[0]} ==="
          if [ -f cmake-config.log ]; then
            echo "########## CMake 错误行 ##########"
            grep -nE -A 8 "CMake Error|Could NOT find|MISSING_SOURCES|No SOURCES" cmake-config.log | head -60
            echo "##################################"
          fi

      - name: 编译
        run: |
          cd "$GITHUB_WORKSPACE"
          set -o pipefail
          cmake --build build -j2 2>&1 | tail -400 | tee build.log
          RC=$?
          echo "=== 编译退出码: $RC ==="
          if [ "$RC" -ne 0 ]; then
            echo "########## 编译错误行 ##########"
            grep -nE "error:|Error [0-9]|undefined reference|fatal error|cannot find" build.log | head -40
            echo "################################"
            exit "$RC"
          fi

      - name: 收集 .so
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "=== build 下所有 .so / .a ==="
          find build -name '*.so' -o -name '*.a' 2>/dev/null | head -20
          echo "=== build 目录树 ==="
          ls -R build 2>/dev/null | head -50
          mkdir -p out
          find build -name 'libguzhenren.so' -exec cp -v {} out/ \;
          ls -la out/

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            cmake-config.log
            build.log
          if-no-files-found: warn

      - name: 上传 .so
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guzhenren-so
          path: out/libguzhenren.so
          if-no-files-found: error
